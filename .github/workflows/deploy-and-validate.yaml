name: Deploy and Validate

on:
  workflow_run:
    workflows: ["Build Charm"]
    types: [completed]
  workflow_call:
    inputs:
      run-id:
        required: false
        type: string
        description: "Run ID of the build workflow to download artifacts from"

jobs:
  deploy-and-validate:
    name: Deploy charm and validate status
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Download charm artifact
        uses: actions/download-artifact@v4
        with:
          name: test-saml-idp-charm
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.run-id || github.event.workflow_run.id }}

      - name: Setup LXD
        uses: canonical/setup-lxd@v0.1.1
        with:
          channel: latest/stable

      - name: Install juju 3.6
        run: sudo snap install juju --classic --channel=3.6/stable

      - name: Bootstrap juju controller
        run: juju bootstrap localhost test-controller

      - name: Add model and deploy charm
        run: |
          juju add-model test-saml-idp
          for charm_file in ./test-saml-idp_*.charm; do
            ubuntu_ver=$(echo "$charm_file" | sed 's/.*_ubuntu@//' | sed 's/-.*//')
            case "$ubuntu_ver" in
              20.04) codename=focal ;;
              22.04) codename=jammy ;;
              24.04) codename=noble ;;
              *)     codename=$(echo "$ubuntu_ver" | tr '.' '_') ;;
            esac
            juju deploy "$charm_file" "test-saml-idp-$codename"
          done

      - name: Validate juju status is not in error state
        run: |
          set -euo pipefail
          # Poll for up to 10 minutes. While a unit agent is still "waiting"
          # (installing), keep polling; once every agent is "idle", assert no
          # application or unit reports an "error" status.
          for i in $(seq 1 20); do
            juju status
            if juju status --format=json | python3 -c '
          import json, sys

          data = json.load(sys.stdin)
          errors = []
          pending = []

          for name, app in (data.get("applications") or {}).items():
              app_status = (app.get("status") or {}).get("status", "")
              if app_status == "error":
                  errors.append(f"application {name!r} is in error state")
              for unit_name, unit in (app.get("units") or {}).items():
                  agent_status = (unit.get("agent-status") or {}).get("status", "")
                  ws = (unit.get("workload-status") or {}).get("status", "")
                  if agent_status == "error":
                      errors.append(f"unit {unit_name!r} agent is in error state")
                  if ws == "error":
                      errors.append(f"unit {unit_name!r} is in error state")
                  if agent_status != "idle":
                      pending.append(
                          f"unit {unit_name!r} agent status is {agent_status!r}"
                      )

          if errors:
              print("\n".join(errors))
              sys.exit(1)
          if pending:
              print("\n".join(pending))
              sys.exit(2)

          print("All units settled with no error states.")
          sys.exit(0)
          '; then
              echo "No error states detected."
              exit 0
            fi
            sleep 30
          done
          echo "Timed out waiting for a non-error status."
          juju status --format=yaml
          exit 1
